name: Replay regression

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-run-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.81.0"
      - name: Show Rustc
        run: rustc --version
      - name: Build replay crate
        run: |
          cargo build -p replay --verbose
      - name: Check the analysis tests are listed
        run: |
          bash scripts/check-replay-test-list.sh
      - name: Run replay binary
        run: |
          cargo run -p replay --manifest-path tools/replay/Cargo.toml --quiet
      - name: Verify deterministic event evidence hashes
        run: |
          cargo run -p replay --manifest-path tools/replay/Cargo.toml --quiet > /tmp/replay-run-1.txt
          cargo run -p replay --manifest-path tools/replay/Cargo.toml --quiet > /tmp/replay-run-2.txt
          diff /tmp/replay-run-1.txt /tmp/replay-run-2.txt
